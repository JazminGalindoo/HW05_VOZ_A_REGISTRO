# Regresión: recalcula métricas desde cache/ (NUNCA re-transcribe) y falla
# si quedan bajo los umbrales de config.yaml. Por ahora solo corre los tests.
name: regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Motor sin UI
        run: python -c "import sys; import src.engine; bad={'streamlit','gradio','telegram'}&set(sys.modules); assert not bad, bad; print('OK: engine sin UI')"
      - run: pytest -q
