# =====================================================================
# config.yaml — ÚNICA fuente de parámetros del proyecto HW05
# Regla: nada hardcodeado en el código. Si un número o ruta aparece en
# src/, debe venir de aquí. Las credenciales NO van aquí (van en .env).
# =====================================================================

# ---------------------------------------------------------------------
# Rutas (relativas a la raíz del repo)
# ---------------------------------------------------------------------
rutas:
  audio_entrevistas: data/audio/entrevistas      # no se commitea
  audio_llamadas: data/audio/llamadas            # no se commitea
  audio_degradado: data/audio/degradado          # L1/, L2/, L3/ dentro
  audio_ruido: data/audio/ruido/ambiente.wav     # ruido para L3 (grabado por mí)
  guiones: scripts_grabacion/guiones.md           # guiones escritos ANTES de grabar
  ground_truth_entrevistas: data/ground_truth/entrevistas.csv
  ground_truth_llamadas: data/ground_truth/llamadas.csv
  transcripts_referencia: data/ground_truth/transcripts_referencia
  cache_transcripts: cache/transcripts           # SÍ se commitea
  cache_results: cache/results                   # SÍ se commitea
  modelos: models                                # pesos descargados, no se commitean

# Plantilla del nombre de cada transcript cacheado (ver CLAUDE.md)
cache_nombre: "{clip}__{modelo}__{device}__{compute}__{glosario}__{nivel}.json"

# ---------------------------------------------------------------------
# ASR: faster-whisper
# ---------------------------------------------------------------------
asr:
  idioma: es                    # idioma fijo, sin autodetección
  modelos: [small, large-v3]    # los 2 tamaños a comparar (large-v3 -> medium si no cabe)
  modelo_default: small         # el que usa process_audio si no se indica otro
  # Device SOLICITADO. El device REAL se lee en runtime del objeto del modelo,
  # nunca de esta clave (es la prueba de que corrió en GPU).
  devices: [cpu, cuda]
  device_default: auto          # auto = cuda si hay GPU, si no cpu
  # Precisiones a comparar. En CPU float16 no aplica -> se usa int8.
  compute_types: [float16, int8]
  compute_type_default: int8
  beam_size: 5
  vad_filter: true              # recorta silencios largos
  word_timestamps: true         # necesario para probabilidad por palabra
  # Muestreo de VRAM con pynvml (hilo paralelo durante la transcripción)
  vram_intervalo_ms: 50
  gpu_indice: 0

# ---------------------------------------------------------------------
# Glosario de dominio (comparación: plano vs con glosario)
# Se pasa como initial_prompt y, si la versión instalada lo soporta, hotwords.
# Verificar con inspect.signature(WhisperModel.transcribe) -> ver README.
# ---------------------------------------------------------------------
glosario:
  modos: [plano, glosario]      # las dos condiciones del experimento
  usar_hotwords: true           # se ignora si la versión no tiene el parámetro
  entrevista:
    initial_prompt: >-
      Entrevista de trabajo. Experiencia en Python, SQL, Power BI, Excel,
      Django, FastAPI, Docker, AWS, pandas, scikit-learn. Pretensión salarial
      en soles o dólares. Nivel de inglés básico, intermedio o avanzado.
    terminos: [Python, SQL, Power BI, Django, FastAPI, Docker, AWS, pandas, scikit-learn, Excel]
  pedido:
    initial_prompt: >-
      Llamada de venta. Pedido con productos, tallas o planes, cantidades,
      precios unitarios en soles, promoción, dirección de entrega,
      método de pago Yape, Plin, tarjeta o efectivo, y total.
    terminos: [Yape, Plin, soles, promoción, delivery, tarjeta, efectivo]

# ---------------------------------------------------------------------
# Normalización de texto (idéntica para hipótesis y referencia en WER)
# ---------------------------------------------------------------------
normalizacion:
  minusculas: true
  quitar_puntuacion: true
  colapsar_espacios: true
  numeros_a_digitos: true       # "seis mil quinientos" -> "6500"
  # DECISIÓN A DOCUMENTAR EN README: quitar tildes evita penalizar
  # "inglés" vs "ingles", pero pierde información. Valor inicial:
  quitar_tildes: true
  # text2num: números por debajo de este umbral NO se convierten.
  # Con el valor por defecto (3) "dos chaufas" quedaba sin convertir;
  # con 0 se convierte todo, incluso "un pollo" -> "1 pollo".
  umbral_text2num: 0
  # Palabras que text2num convierte por error y se protegen:
  # ordinales ("dos cuartos de pollo" -> "2 4ᵒˢ") y "unos/unas" ("unos 6500" -> "1 6500").
  palabras_protegidas: [cuarto, cuartos, primer, primero, primera, segundo, segunda,
                        tercer, tercero, tercera, medio, media, unos, unas]
  # Reglas propias para coloquialismos que text2num no resuelve:
  # "2 años y medio" / "3 y medio años" -> 2.5 / 3.5 (solo con estas unidades,
  # para no tocar "gaseosa de litro y medio", que es nombre de producto)
  unidades_y_medio: [años, meses, semanas, horas]
  # "seis lucas" -> 6000
  multiplicadores:
    luca: 1000
    lucas: 1000

# ---------------------------------------------------------------------
# Extracción
# ---------------------------------------------------------------------
extraccion:
  metodos: [reglas, llm]        # se comparan ambos

  # Categorías cerradas: las usan las reglas, el JSON schema del LLM y las métricas
  categorias:
    nivel_ingles: [basico, intermedio, avanzado, nativo]
    moneda: [PEN, USD]
    metodo_pago: [yape, plin, tarjeta, efectivo, transferencia]

  # Para resolver fechas dichas sin año ("primero de diciembre")
  anio_referencia: 2026

  # --- Vocabulario de las reglas (se normaliza igual que el transcript) ---
  reglas:
    tecnologias_conocidas: [Python, SQL, Power BI, Excel, Java, Spring Boot, Docker,
                            Kubernetes, Google Analytics, HubSpot, Canva, Jira, AWS,
                            Terraform, Django, FastAPI, pandas, scikit-learn, Tableau,
                            Azure, Git, JavaScript, React]
    # palabra dicha -> código de moneda
    monedas: {soles: PEN, sol: PEN, lucas: PEN, dolares: USD, dolar: USD}
    # categoría -> palabras que la indican
    metodos_pago:
      yape: [yape]
      plin: [plin]
      tarjeta: [tarjeta, pos]
      efectivo: [efectivo]
      transferencia: [transferencia]
    distritos: [surco, cercado, san isidro, lince, miraflores, san borja, la molina,
                barranco, jesus maria, pueblo libre, magdalena, san miguel, los olivos,
                chorrillos, ate, breña, rimac, callao]
    # Carta de la pollería: nombre canónico (igual que el ground truth),
    # tamaño y formas de decirlo. SIN precios: el precio se extrae del audio.
    carta:
      - {producto: pollo entero, tamano: entero, alias: [pollo entero, pollos enteros]}
      - {producto: medio pollo, tamano: medio, alias: [medio pollo, medios pollos]}
      - {producto: cuarto de pollo, tamano: cuarto, alias: [cuarto de pollo, cuartos de pollo]}
      - {producto: arroz chaufa, tamano: null, alias: [arroz chaufa, arroces chaufa, chaufas, chaufa]}
      - {producto: papas familiares, tamano: familiar, alias: [papas familiares]}
      - {producto: ensalada, tamano: null, alias: [ensaladas, ensalada]}
      - {producto: gaseosa 1.5L, tamano: 1.5L, alias: [gaseosas de litro y medio, gaseosa de litro y medio, gaseosas, gaseosa]}

  # --- LLM ---
  llm:
    proveedor: anthropic
    modelo: claude-opus-5-5     # alternativa más barata: claude-haiku-5-5
    # NO hay "temperatura": desde la versión de API 2026-10-21 (SDK anthropic 2.x)
    # enviar temperature da error 400, y los modelos actuales solo aceptan el
    # valor por defecto. La salida se fija con structured outputs (JSON schema)
    # y poco esfuerzo de razonamiento.
    effort: low                 # low | medium | high | xhigh | max
    max_tokens: 16000           # incluye el razonamiento interno; no bajarlo mucho
    reintentos: 2               # si el JSON no valida contra schemas.py
    # Si el modelo rechaza la solicitud, el API la reintenta en otro modelo.
    # null para desactivarlo.
    fallbacks: default
    beta_fallbacks: server-side-fallback-2026-07-01
    # Variable de entorno que contiene la API key (el valor va en .env)
    api_key_env: ANTHROPIC_API_KEY
  prompts:
    sistema: >-
      Eres un extractor de datos. Recibes la transcripción automática de un audio
      en español. Llena los campos pedidos. Si un dato no se dice en el audio, usa
      null. No corrijas ni inventes valores: usa los números tal como aparecen en
      la transcripción, aunque parezcan un error (por ejemplo, un total mal sumado).
    entrevista: >-
      Extrae los datos del candidato de esta entrevista de trabajo.
      anios_experiencia: años de experiencia total (número; "dos años y medio" = 2.5).
      ultimo_puesto: el cargo, sin la empresa. tecnologias: solo las que usa o usó
      de verdad (no las que dice que ya no usa). pretension_salarial: monto mensual
      (número) y moneda (PEN para soles, USD para dólares). disponibilidad: "inmediata",
      "N_semanas", "N_mes"/"N_meses" (ej. "2_semanas") o fecha AAAA-MM-DD si dice una
      fecha (año {anio}). nivel_ingles: el que declara el candidato.
    pedido: >-
      Extrae el pedido FINAL de esta llamada de venta: si el cliente se corrige, usa
      la última versión. items: producto, tamano_o_plan (o null), cantidad y
      precio_unitario dicho. promocion: descripción breve o null. descuento: soles
      que descuenta la promoción (0 si no hay; en un 2x1, el precio de la unidad
      gratis). direccion_entrega: vía, número, interior/departamento y distrito.
      metodo_pago: cómo va a pagar. total_dicho: el total que se dice en voz alta,
      aunque no cuadre con la suma.

# ---------------------------------------------------------------------
# Verificación literal (regla dura #7)
# ---------------------------------------------------------------------
verificacion:
  etiqueta_ok: verificado
  etiqueta_no: sin_verificar

# ---------------------------------------------------------------------
# Validación aritmética del pedido (Tarea 2)
# sum(cantidad * precio_unitario) - promocion == total_dicho
# ---------------------------------------------------------------------
validacion:
  tolerancia_soles: 0.5         # diferencia máxima aceptada
  # Diagnóstico ASR vs hablante: umbral de probabilidad por palabra
  # en los tokens numéricos. Por debajo -> sospecha de error de ASR.
  prob_palabra_min: 0.80

# ---------------------------------------------------------------------
# Escalera de degradación (Tarea 2) — reproducible con ffmpeg
# ---------------------------------------------------------------------
degradacion:
  niveles: [L0, L1, L2, L3]
  L1:                           # tipo WhatsApp
    canales: 1
    codec: libopus
    bitrate_kbps: 12
  L2:                           # tipo teléfono
    paso_banda_hz: [300, 3400]
    sample_rate_hz: 8000
  L3:                           # L1 + ruido ambiente
    base: L1
    snr_db: 10                  # SNR objetivo; el real se CALCULA con RMS y se reporta
    # Si L3 sigue perfecto, bajar el SNR (endurecer) y documentarlo
    snr_db_alternativos: [5, 0]

# ---------------------------------------------------------------------
# Métricas y bootstrap
# ---------------------------------------------------------------------
metricas:
  bootstrap_n: 1000             # réplicas (remuestreo por clip)
  bootstrap_alpha: 0.05         # IC al 95 %
  semilla: 42

# ---------------------------------------------------------------------
# Regresión en CI (lee cache/, nunca re-transcribe)
# Valores iniciales: ajustarlos cuando haya resultados reales.
# ---------------------------------------------------------------------
regresion:
  wer_max: 0.30
  accuracy_campos_min: 0.70
