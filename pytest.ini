[pytest]
# La raíz del repo va al path para que "import src.xxx" funcione
# igual con "pytest" (CI) que con "python -m pytest" (local)
pythonpath = .
testpaths = tests
# Los tests "lento" descargan un modelo de Whisper: se corren a mano con  pytest -m lento
markers =
    lento: descarga un modelo y transcribe de verdad (no corre en CI)
addopts = -m "not lento"
